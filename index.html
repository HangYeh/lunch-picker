<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fff8f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1f1a17" media="(prefers-color-scheme: dark)">
  <title>今天吃什麼？</title>
  <style>
    /* 顏色都集中在這裡；深色模式跟隨系統設定（prefers-color-scheme）自動切換 */
    :root {
      color-scheme: light dark;
      --bg: #fff8f0;
      --card: #ffffff;
      --text: #3a2e25;
      --muted: #8a7a6d;
      --accent: #ff6b35;
      --accent-dark: #e0521f;
      --chip: #ffe8d9;
      --hint: #c2410c;
      --hover: rgba(0, 0, 0, 0.1);
      --shadow: rgba(0, 0, 0, 0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1f1a17;
        --card: #2b2420;
        --text: #f5ebe2;
        --muted: #b3a295;
        --chip: #4a3326;
        --hint: #ff9a6c;
        --hover: rgba(255, 255, 255, 0.15);
        --shadow: rgba(0, 0, 0, 0.4);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 10px 30px var(--shadow);
    }
    h1 { margin: 0 0 8px; font-size: 1.6rem; }
    .subtitle { margin: 0 0 24px; color: var(--muted); font-size: 0.95rem; }

    .result-box {
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      border: 3px dashed var(--chip);
      border-radius: 16px;
      overflow: hidden;
    }
    .result {
      font-size: 2rem;
      font-weight: 700;
    }
    .result.placeholder { color: var(--muted); font-size: 1.1rem; font-weight: 400; }
    .result.spinning { animation: flick 0.08s linear infinite; }
    .result.done { color: var(--accent); animation: pop 0.45s ease-out; }

    @keyframes flick {
      from { transform: translateY(-30%); opacity: 0.4; }
      to   { transform: translateY(30%);  opacity: 1; }
    }
    @keyframes pop {
      0%   { transform: scale(0.6); }
      60%  { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .go {
      width: 100%;
      padding: 20px;
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 6px 0 var(--accent-dark);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .go:hover { filter: brightness(1.05); }
    .go:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--accent-dark); }
    .go:disabled { opacity: 0.7; cursor: wait; }

    .list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin: 28px 0 0;
      padding: 0;
      list-style: none;
    }
    .list li {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--chip);
      padding: 6px 6px 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      transition: background 0.2s, color 0.2s;
    }
    .list li.active { background: var(--accent); color: #fff; }
    .list .remove {
      width: 20px;
      height: 20px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: inherit;
      font-size: 1rem;
      line-height: 1;
      cursor: pointer;
      opacity: 0.6;
    }
    .list .remove:hover { opacity: 1; background: var(--hover); }
    .list .remove:disabled { visibility: hidden; }
    .empty { margin: 28px 0 0; color: var(--muted); font-size: 0.9rem; }

    .add-form {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }
    .add-form input {
      flex: 1;
      min-width: 0;
      padding: 10px 14px;
      font-size: 1rem;
      color: var(--text);
      background: transparent;
      border: 2px solid var(--chip);
      border-radius: 999px;
      outline: none;
    }
    .add-form input:focus { border-color: var(--accent); }
    .add-form button {
      padding: 10px 18px;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 999px;
      cursor: pointer;
    }
    .add-form button:disabled { opacity: 0.6; cursor: not-allowed; }
    .hint { min-height: 1.2em; margin: 8px 0 0; color: var(--hint); font-size: 0.85rem; }
    .reset {
      margin-top: 4px;
      padding: 4px;
      font-size: 0.8rem;
      color: var(--muted);
      background: none;
      border: none;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>🍱 午餐選擇器</h1>
    <p class="subtitle">選擇困難？交給命運吧！</p>

    <div class="result-box">
      <div id="result" class="result placeholder" aria-live="polite">按下按鈕開始抽籤</div>
    </div>

    <button id="go" class="go">今天吃什麼？</button>

    <ul id="list" class="list"></ul>
    <p id="empty" class="empty" hidden>清單是空的，先新增幾家餐廳吧！</p>

    <form id="add-form" class="add-form">
      <input id="new-name" type="text" placeholder="輸入餐廳名稱" maxlength="20" aria-label="餐廳名稱">
      <button type="submit">新增</button>
    </form>
    <p id="hint" class="hint" aria-live="polite"></p>
    <button id="reset" class="reset" type="button">恢復預設清單</button>
  </main>

  <script>
    const STORAGE_KEY = "lunch-picker.restaurants";
    const DEFAULT_RESTAURANTS = [
      "麥當勞",
      "肯德基",
      "摩斯漢堡",
      "八方雲集",
      "四海遊龍",
      "吉野家",
      "爭鮮",
      "Subway",
      "鼎泰豐",
      "路邊自助餐"
    ];

    const resultEl = document.getElementById("result");
    const button = document.getElementById("go");
    const listEl = document.getElementById("list");
    const emptyEl = document.getElementById("empty");
    const form = document.getElementById("add-form");
    const input = document.getElementById("new-name");
    const hintEl = document.getElementById("hint");
    const resetBtn = document.getElementById("reset");

    let restaurants = load();
    let items = [];
    let spinning = false;

    // localStorage 可能被停用（無痕模式等），失敗時退回預設清單
    function load() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (Array.isArray(saved) && saved.every(n => typeof n === "string")) {
          return saved;
        }
      } catch (e) {}
      return [...DEFAULT_RESTAURANTS];
    }

    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(restaurants));
      } catch (e) {}
    }

    function render() {
      listEl.innerHTML = "";
      items = restaurants.map((name, i) => {
        const li = document.createElement("li");
        const label = document.createElement("span");
        label.textContent = name;
        const remove = document.createElement("button");
        remove.className = "remove";
        remove.type = "button";
        remove.textContent = "×";
        remove.title = `刪除 ${name}`;
        remove.setAttribute("aria-label", `刪除 ${name}`);
        remove.disabled = spinning;
        remove.addEventListener("click", () => removeAt(i));
        li.append(label, remove);
        listEl.appendChild(li);
        return li;
      });
      emptyEl.hidden = restaurants.length > 0;
      button.disabled = spinning || restaurants.length === 0;
      form.querySelector("button").disabled = spinning;
      resetBtn.disabled = spinning;
    }

    function removeAt(index) {
      restaurants.splice(index, 1);
      save();
      render();
    }

    form.addEventListener("submit", e => {
      e.preventDefault();
      const name = input.value.trim();
      if (!name) {
        hintEl.textContent = "請輸入餐廳名稱";
        return;
      }
      if (restaurants.includes(name)) {
        hintEl.textContent = `「${name}」已經在清單裡了`;
        return;
      }
      restaurants.push(name);
      save();
      render();
      input.value = "";
      hintEl.textContent = "";
      input.focus();
    });

    input.addEventListener("input", () => { hintEl.textContent = ""; });

    resetBtn.addEventListener("click", () => {
      if (!confirm("要恢復成預設的 10 家餐廳嗎？目前的清單會被取代。")) return;
      restaurants = [...DEFAULT_RESTAURANTS];
      save();
      render();
    });

    function highlight(index) {
      items.forEach((li, i) => li.classList.toggle("active", i === index));
    }

    button.addEventListener("click", () => {
      if (restaurants.length === 0) return;
      spinning = true;
      render();
      resultEl.className = "result spinning";

      const finalIndex = Math.floor(Math.random() * restaurants.length);
      const totalSteps = 25;
      let step = 0;

      // 由快到慢地輪流顯示店名，最後停在 finalIndex
      function tick() {
        const index = step === totalSteps
          ? finalIndex
          : Math.floor(Math.random() * restaurants.length);
        resultEl.textContent = restaurants[index];
        highlight(index);

        if (step < totalSteps) {
          step++;
          setTimeout(tick, 40 + step * step * 0.3);
        } else {
          spinning = false;
          render();
          highlight(finalIndex);
          resultEl.className = "result done";
          button.textContent = "再抽一次！";
        }
      }
      tick();
    });

    render();
  </script>
</body>
</html>
